<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    
    <!-- ✅ Preload Background Image for Faster LCP -->
    <link rel="preload" href="/cotton-candy-castle.webp" as="image" fetchpriority="high">


    <link rel="icon" href="/linkedin-headshot.png" sizes="200x200" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0C0F" />
    <meta name="description" content="Jaqueline Smith - Software Engineer Portfolio showcasing full-stack development expertise in React, Firebase and modern web technologies." />
    <title>Jaqueline's Portfolio</title>

    <!-- Preload Google Fonts (Nunito, Dancing Script, Playfair Display - used across site) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Nunito:wght@500;700;800;900&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Nunito:wght@500;700;800;900&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
    </noscript>

    <link rel="apple-touch-icon" href="/linkedin-headshot.webp" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Critical inline CSS: match App.css background before index.css loads.
         .gs-hero must stay transparent — the home route's animated gradient +
         orb layer (HomeOrbBackground) now paints behind it at the app-shell
         level, and an opaque .gs-hero background would occlude it. -->
    <style>
      .app-shell {
        background-color: #0B0C0F; /* var(--color-bg-page) — Black + White Light */
      }
      .gs-hero { height: 100%; width: 100%; }
    </style>
  </head>
  
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
